<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>一键复制</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'PingFang SC','Microsoft YaHei',sans-serif;margin:24px;line-height:1.6}
  textarea{width:100%;height:40vh}
  button{padding:12px 16px;font-size:16px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style>

<h2>一键复制</h2>
<p>点击下方按钮即可复制：</p>
<textarea id="t" readonly></textarea>
<div class="row">
  <button id="btn">复制内容</button>
  <button id="sel">仅选中文本</button>
</div>

<script>
// 从 #b64: 片段解码文本（URL-safe Base64）
function readFromHash(){
  const h = location.hash || "";
  const m = h.match(/^#b64:([A-Za-z0-9_-]+)$/);
  if(!m) return "";
  let b = m[1];
  b += "=".repeat((4 - b.length % 4) % 4); // 补齐 padding
  const s = atob(b.replace(/-/g,'+').replace(/_/g,'/'));
  // 将二进制字符串还原为 UTF-8（在部分旧内核上用 escape 兜底）
  try {
    const bytes = new Uint8Array(s.length);
    for (let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
    return (window.TextDecoder ? new TextDecoder().decode(bytes) : decodeURIComponent(escape(s)));
  } catch (e) {
    return decodeURIComponent(escape(s));
  }
}
const area = document.getElementById('t');
area.value = readFromHash();

// 复制实现：现代 → 传统 → 选中兜底
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'absolute';
  ta.style.left = '-9999px';     // 不用 display:none，确保可选中
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return ok;
}
async function doCopy(text){
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  }
  return legacyCopy(text);
}

// 按钮交互
const btn = document.getElementById('btn');
const sel = document.getElementById('sel');

btn.addEventListener('click', async () => {
  const text = area.value || "";
  try {
    const ok = await doCopy(text);
    if (ok) {
      btn.textContent = "已复制 ✅";
    } else {
      area.focus(); area.select(); area.setSelectionRange(0, area.value.length);
      btn.textContent = "复制失败，已选中文本";
    }
  } catch (e) {
    area.focus(); area.select(); area.setSelectionRange(0, area.value.length);
    btn.textContent = "复制失败，请长按选择复制";
  }
});

sel.addEventListener('click', () => {
  area.focus(); area.select(); area.setSelectionRange(0, area.value.length);
});
</script>
