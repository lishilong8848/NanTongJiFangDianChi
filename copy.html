<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一键复制</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'PingFang SC','Microsoft YaHei',sans-serif;margin:24px;line-height:1.6}
  textarea{width:100%;height:40vh}
  button{padding:12px 16px;font-size:16px}
</style>
<h2>一键复制</h2>
<p>页面不会向服务器上传你扫描到的内容（数据在 URL 的 <code>#</code> 片段里，留在本地浏览器）。</p>
<textarea id="t" readonly>解析中...</textarea><br><br>
<button id="btn">复制内容</button>

<script>
function b64UrlToUint8(s){
  s = s.replace(/^b64[:=]/,'').replace(/-/g,'+').replace(/_/g,'/');
  if (s.length % 4) s += '='.repeat(4 - (s.length % 4));
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function decodeHash(){
  const raw = (location.hash || '').replace(/^#/,'');
  const payload = raw.replace(/^b64[:=]/,''); // 兼容 b64: 或 b64=
  if (!payload){ return '（URL中没有数据）'; }
  try{
    const bytes = b64UrlToUint8(payload);
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){
    return '解析失败：' + e;
  }
}
const ta = document.getElementById('t');
ta.value = decodeHash();

const btn = document.getElementById('btn');
btn.addEventListener('click', async ()=>{
  const t = ta.value;
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(t);
    }else{
      const ta2 = document.createElement('textarea');
      ta2.value = t; ta2.style.position='fixed'; ta2.style.opacity='0';
      document.body.appendChild(ta2); ta2.focus(); ta2.select();
      document.execCommand('copy'); document.body.removeChild(ta2);
    }
    btn.textContent = '已复制 ✅';
  }catch(e){ btn.textContent = '复制失败，请长按全选复制'; }
});
</script>
