<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一键复制</title>
<style>
    body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 24px;
        line-height: 1.6;
        background: #f5f5f5
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1)
    }

    textarea {
        width: 100%;
        height: 150px;
        margin-bottom: 16px;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: monospace;
        resize: vertical
    }

    button {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        color: #fff;
        background: #007aff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: active 0.1s
    }

    button:active {
        opacity: 0.8
    }

    .version {
        text-align: center;
        font-size: 12px;
        color: #999;
        margin-top: 20px;
        margin-bottom: 10px
    }

    #log {
        margin-top: 20px;
        padding: 10px;
        background: #333;
        color: #0f0;
        font-size: 12px;
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-all;
        display: none
    }
</style>

<div class="container">
    <h2>一键复制</h2>
    <p style="color:#666;font-size:14px">点击下方按钮即可复制内容并通知：</p>
    <textarea id="t" readonly></textarea>
    <button id="btn">复制内容</button>

    <div id="log"></div>
    <div class="version">Page Version: v1.0.5 (No-CORS Mode)</div>
</div>

<script>
    // --- 日志工具 ---
    const logEl = document.getElementById('log');
    function logToScreen(msg, type = 'info') {
        logEl.style.display = 'block';
        const time = new Date().toLocaleTimeString();
        logEl.innerText += `[${time}] ${msg}\n`;
        console.log(msg);
    }

    // 1. URL 解析
    const params = new URLSearchParams(window.location.search);
    const L_HAO = params.get('l_hao') || 'Unknown';

    // 2. Base64 解析
    function init() {
        const hash = window.location.hash;
        if (hash.startsWith('#b64:')) {
            const b64 = hash.slice(5);
            try {
                let stdB64 = b64.replace(/-/g, '+').replace(/_/g, '/');
                while (stdB64.length % 4) { stdB64 += '='; }
                const text = decodeURIComponent(escape(window.atob(stdB64)));
                document.getElementById('t').value = text;
            } catch (e) {
                document.getElementById('t').value = "解码失败：" + e;
                logToScreen("Base64解码错误: " + e, 'error');
            }
        } else {
            document.getElementById('t').value = "URL 数据无效";
        }
    }

    // 3. 点击事件
    const btn = document.getElementById('btn');
    btn.addEventListener('click', async () => {
        const t = document.getElementById('t').value;
        logToScreen("正在尝试发送 webhook (No-CORS Mode)...", 'info');

        // ★★★ 关键修改：mode: 'no-cors'，去掉 json header ★★★
        // 这样浏览器会作为 'text/plain' 发送 POST，不触发 OPTIONS 预检。
        // 如果飞书后端能兼容纯文本 body 的 JSON，就能成功。
        fetch("https://vnet.feishu.cn/base/automation/webhook/event/RI6naGJV5w4eeQhQJ1ccMOTTnng", {
            method: "POST",
            mode: 'no-cors', // 允许跨域盲发
            // headers: { "Content-Type": "application/json" }, // 必须去掉，否则不是简单请求
            body: JSON.stringify({
                content: t,
                L_HAO: L_HAO
            })
        })
            .then(response => {
                // no-cors 模式下 type 为 'opaque'，status 为 0，无法知道结果是 200 还是 500
                // 但只要没报错，就说明请求发出去了
                logToScreen("请求已发出！(无回执模式)");
                logToScreen("注意：由于跨域限制，无法确认飞书接收结果，请直接查看飞书群。");
            })
            .catch(e => {
                logToScreen("发送严重错误: " + e);
            });

        // 复制逻辑
        async function performCopy(text) {
            // 优先尝试 Clipboard API
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (err) {
                console.warn("Clipboard API 失败，尝试降级方案...", err);
            }

            // 降级方案：document.execCommand
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                // 移出可视区域但保持可选中
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(ta);
                if (successful) return true;
            } catch (err) {
                console.error("execCommand 失败", err);
            }
            return false;
        }

        const success = await performCopy(t);
        if (success) {
            btn.textContent = '已复制 ✅';
            setTimeout(() => btn.textContent = '复制内容', 3000);
        } else {
            logToScreen("复制失败: 浏览器均拒绝访问剪贴板");
            btn.textContent = '复制失败';
        }
    });

    init();
</script>
