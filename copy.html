<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一键复制</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'PingFang SC','Microsoft YaHei',sans-serif;margin:24px;line-height:1.6}
textarea{width:100%;height:40vh}
button{padding:12px 16px;font-size:16px}
</style>
<h2>一键复制</h2>
<p>点击下方按钮即可复制：</p>
<textarea id="t" readonly></textarea><br><br>
<button id="btn">复制内容</button>

<script>
// 1. 从 URL 解析 L_HAO (?l_hao=X)
const params = new URLSearchParams(window.location.search);
const L_HAO = params.get('l_hao') || 'Unknown';

// 2. 从 Hash 解析文本 (#b64:XXXX)
function init() {
  const hash = window.location.hash; // #b64:....
  if (hash.startsWith('#b64:')) {
    const b64 = hash.slice(5); // 去掉 #b64:
    try {
        // URL-Safe Base64 处理: - -> +, _ -> /
        let stdB64 = b64.replace(/-/g, '+').replace(/_/g, '/');
        // 补齐 padding
        while (stdB64.length % 4) { stdB64 += '='; }
        // 解码 (UTF-8 兼容)
        const text = decodeURIComponent(escape(window.atob(stdB64)));
        document.getElementById('t').value = text;
    } catch (e) {
        document.getElementById('t').value = "解码失败：" + e;
    }
  } else {
    document.getElementById('t').value = "URL 中未包含有效数据 (Format: #b64:...)";
  }
}

// 3. 按钮点击：发送 Webhook + 复制
const btn = document.getElementById('btn');
btn.addEventListener('click', async () => {
  const t = document.getElementById('t').value;
  
  // 发送 Webhook
  fetch("https://vnet.feishu.cn/base/automation/webhook/event/RI6naGJV5w4eeQhQJ1ccMOTTnng", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
        content: t,
        L_HAO: L_HAO
    })
  }).then(() => console.log('Webhook sent')).catch(e => console.error(e));

  // 执行复制
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(t);
    } else {
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.textContent = '已复制 ✅';
  } catch (e) {
    btn.textContent = '复制失败，请长按全选复制';
  }
});

init();
</script>
